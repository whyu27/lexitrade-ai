<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LexiTrade AI — Motion Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, #27272a22 1px, transparent 1px),
                        linear-gradient(to bottom, #27272a22 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 12px;
      font-family: monospace;
      border-radius: 9999px;
      margin-bottom: 24px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .title {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .title span {
      color: #10b981;
      -webkit-text-fill-color: #10b981;
    }
    .subtitle {
      font-size: 22px;
      color: #a1a1aa;
      font-weight: 400;
      max-width: 680px;
      margin: 0 auto 36px auto;
      line-height: 1.5;
    }
    .meta {
      display: flex;
      gap: 16px;
      justify-content: center;
      font-family: monospace;
      font-size: 13px;
      color: #71717a;
    }
    .meta span {
      background: #18181b;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #27272a;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="badge">DoraHacks • BLI Legal Tech Hackathon 2</div>
    <h1 class="title">LexiTrade <span>AI</span></h1>
    <p class="subtitle">From Regulatory News to Explainable Practice Trades</p>
    <div class="meta">
      <span>Track: RYO-CHAN Autonomous Agents</span>
      <span>Engine: Gemini 3.5 Flash</span>
      <span>Compliance: SHA-256 Audit Chain</span>
    </div>
  </div>
</body>
</html>
